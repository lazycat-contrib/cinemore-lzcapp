application:
  subdomain: cinemore
  background_task: true
  multi_instance: true
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://cinemore:8000/

services:
  cinemore:
    # upstream: cinemore/cinemore-server:latest
    image: cinemore/cinemore-server:latest
    binds:
      - /lzcapp/var/data:/app/data
      - /lzcapp/run/mnt/home/Movie:/media

ext_config:
  enable_document_access: true
  enable_media_access: true
